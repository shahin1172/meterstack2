name: Django CI (Robot Inspector)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 🟢 The Robot spins up temporary machines (Postgres & Redis) for the test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: meterstack_user
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: meterstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Check out the code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🗄️ Run Migrations
      env:
        POSTGRES_DB: meterstack
        POSTGRES_USER: meterstack_user
        POSTGRES_PASSWORD: change_me
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DJANGO_SECRET_KEY: "fake-secret-key-for-ci"
        DJANGO_DEBUG: "False"
      run: |
        python manage.py migrate

    - name: 🧪 Run Tests
      env:
        POSTGRES_DB: meterstack
        POSTGRES_USER: meterstack_user
        POSTGRES_PASSWORD: change_me
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DJANGO_SECRET_KEY: "fake-secret-key-for-ci"
        DJANGO_DEBUG: "False"
      run: |
        python manage.py test